      cloud:'同步 · 尚未連接', ai:'AI 回顧 · 關閉', advancedFuture:'排程、雲端連接與 AI 回顧仍在設計中。',
      demo:'互動概念 · 範例日記', finish:'模擬本段結束', restart:'重新預覽', interrupted:'已經停下，想開始時再回來。',
      pausedTitle:'不用著急。', pausedSub:'這一段提前結束，不計為已完成的專注。', restartHome:'返回此刻', minute:'分鐘',
      elapsed:'預覽時段已完成', notesKept:'文字已加入預覽日記', noteEdited:'預覽中的信件已修改', mainNav:'主導覽',
      minutesPattern:'專注 {focus} 分鐘，然後休息 {rest} 分鐘。', restLength:'準備好後，休息 {rest} 分鐘。', setupHeading:'安靜地進入下一刻。',
      lettersHero:'此刻的一段時光。\n留給未來的一封信。', lettersIntro:'為回來時的自己，留幾句話。', fullscreenHint:'專注'
    }
  };
  const stages = ['home','focus','focusComplete','readyRest','rest','restComplete','readyFocus','stopped'];
  const systemLanguage = () => {
    const language = String(navigator.language || 'en').toLowerCase();
    if (/^zh.*(hant|tw|hk|mo)/.test(language)) return 'zh-Hant';
    return language.startsWith('zh') ? 'zh-Hans' : 'en';
  };
  const makeState = () => ({ stage:'home', view:'now', language:'system', appearance:'system', focus:25, short:5, long:30, every:3, completed:0, activeRestType:null, restStyle:'screen', intention:'', draft:'', letters:[], editing:null, restIdea:'walk', notice:'' });
  const state = { quiet:makeState(), letters:makeState() };
  const apps = { quiet:root.querySelector('[data-app="quiet"]'), letters:root.querySelector('[data-app="letters"]') };
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lang = s => s.language === 'system' ? systemLanguage() : s.language;
  const words = s => copy[lang(s)] || copy.en;
  const button = (label, action, style='rh-secondary', extra='') => `<button type="button" class="cursor-interaction ${style}" data-action="${action}" ${extra}>${esc(label)}</button>`;
  const pattern = s => words(s).minutesPattern.replace('{focus}',s.focus).replace('{rest}',s.short);
  const longRestDue = s => s.completed >= s.every;
  const restMinutes = s => longRestDue(s) ? s.long : s.short;
  const restLength = s => words(s).restLength.replace('{rest}',restMinutes(s));
  function restore(saved) {
    const data = saved && saved.privateContent;
    if (!data || data.schema !== 1) return;
    for (const key of Object.keys(state)) {
      const prior = data[key];
      if (!prior) continue;
      if (['system','en','zh-Hans','zh-Hant'].includes(prior.language)) state[key].language = prior.language;
      if (['system','light','dark'].includes(prior.appearance)) state[key].appearance = prior.appearance;
    }
  }
  restore(window.openai && window.openai.widgetState);
  function remember() {
    if (!window.openai || !window.openai.setWidgetState) return;
    const preferences = key => ({ language:state[key].language, appearance:state[key].appearance });
    window.openai.setWidgetState({ modelContent:{ product:'Rhythm', conceptLanguages:{quiet:state.quiet.language,letters:state.letters.language} }, privateContent:{schema:1,quiet:preferences('quiet'),letters:preferences('letters')} }).catch(() => {});
  }
  const footer = t => `<footer class="rh-bottom"><span>${esc(t.local)}</span><span>${esc(t.ready)}</span></footer>`;
  function header(s,t) {
    const active = s.stage === 'focus' || s.stage === 'rest';
    return `<header class="rh-header"><div class="rh-brand"><i data-lucide="sprout" aria-hidden="true"></i>rhythm</div>${active ? `<span class="rh-caption">${esc(s.stage === 'focus' ? t.fullscreenHint : t.restStyle)}</span>` : `<nav class="rh-nav" aria-label="${esc(t.mainNav)}">${['now','journal','advanced'].map(view => button(t[view],`view-${view}`,'',s.view === view ? 'aria-current="page"' : '')).join('')}</nav>`}</header>`;
  }
  function home(key,s,t) {
    const intention = `<label class="rh-intention"><span class="rh-label">${esc(t.intention)}</span><input data-input="intention" maxlength="200" value="${esc(s.intention)}" placeholder="${esc(t.intentionPlaceholder)}"></label>`;
    if (key === 'letters') {
      return `<main class="rh-home"><div class="rh-home-main"><span class="rh-kicker">${esc(t.room)}</span><h1>${esc(t.lettersHero).replace(/\n/g,'<br>')}</h1><p class="rh-sub">${esc(t.lettersIntro)}</p>${intention}<div class="rh-actions">${button(t.begin,'start-focus','rh-primary')}</div><p class="rh-caption">${esc(pattern(s))}</p></div><aside class="rh-home-aside"><span class="rh-kicker">${esc(t.letterFrom)}</span><blockquote>${esc(t.sample).replace(/\n/g,'<br>')}</blockquote>${button(t.read,'view-journal','rh-link')}<span class="rh-caption">${esc(t.sampleLabel)}</span></aside></main>`;
    }
    return `<main class="rh-home"><span class="rh-kicker">${esc(t.room)}</span><h1>${esc(t.hello)}</h1><p class="rh-sub">${esc(t.intro)}</p><div class="rh-still" aria-hidden="true"></div>${intention}<div class="rh-actions">${button(t.begin,'start-focus','rh-primary')}</div><p class="rh-caption">${esc(pattern(s))}</p><div class="rh-letter-teaser"><p>${esc(t.letterFrom)}</p>${button(t.read,'view-journal','rh-link')}</div></main>`;
  }
  function moment(s,t) {
    if (s.stage === 'focus') return `<main class="rh-running"><span class="rh-kicker">${esc(t.focusLabel)}</span><h1>${esc(t.focusTitle)}</h1><div class="rh-still" aria-hidden="true"></div><p class="rh-intention-note">${esc(s.intention || t.focusSub)}</p>${button(t.endEarly,'stop','rh-link')}</main>`;
    if (s.stage === 'rest') return `<main class="rh-running ${s.restStyle==='screen'?'rh-resting':''}"><span class="rh-kicker">${esc(s.restStyle==='screen'?t.screen:t.invitation)}</span><h1>${esc(t.restTitle)}</h1><p class="rh-sub">${esc(t.restSub)}</p><div class="rh-still" aria-hidden="true"></div><p class="rh-sub">${esc(t[s.restIdea+'Text'])}</p><div class="rh-rest-ideas">${['walk','water','eyes','breathe'].map(idea => button(t[idea],`idea-${idea}`,'',`aria-pressed="${idea === s.restIdea}"`)).join('')}</div>${button(t.exit,'stop','rh-link')}</main>`;
    if (s.stage === 'focusComplete' || s.stage === 'restComplete') {
      const focusDone = s.stage === 'focusComplete';
      return `<main class="rh-body"><div class="rh-reflection"><span class="rh-kicker">${esc(focusDone ? t.focused : t.restDone)}</span><h1>${esc(focusDone ? (longRestDue(s) ? t.longRest : t.restReady) : t.restPrompt)}</h1>${focusDone ? `<p class="rh-sub">${esc(t.focusPrompt)}</p>` : ''}<label><span class="rh-label">${esc(t.optional)}</span><textarea data-input="draft" maxlength="4000" placeholder="${esc(t.reflectionPlaceholder)}">${esc(s.draft)}</textarea></label><div class="rh-actions">${button(t.save,'keep-reflection','rh-primary')}${button(t.skip,'skip-reflection','rh-link')}</div><p class="rh-caption">${esc(t.previewOnly)}</p></div></main>`;
    }
    if (s.stage === 'readyRest') return `<main class="rh-running"><span class="rh-kicker">${esc(t.restStyle)}</span><h1>${esc(longRestDue(s) ? t.longRest : t.restReady)}</h1><p class="rh-sub">${esc(t.restReadySub)}</p><p class="rh-caption">${esc(restLength(s))}</p><div class="rh-actions">${button(t.startRest,'start-rest','rh-primary')}${button(t.later,'return-home','rh-link')}</div><p class="rh-caption">${esc(t.confirmAlways)}</p></main>`;
    if (s.stage === 'readyFocus') return `<main class="rh-running"><span class="rh-kicker">${esc(t.setupHeading)}</span><h1>${esc(t.nextReady)}</h1><p class="rh-sub">${esc(t.nextSub)}</p><label class="rh-intention"><span class="rh-label">${esc(t.intention)}</span><input data-input="intention" maxlength="200" value="${esc(s.intention)}" placeholder="${esc(t.intentionPlaceholder)}"></label><div class="rh-actions">${button(t.startFocus,'start-focus','rh-primary')}${button(t.later,'return-home','rh-link')}</div><p class="rh-caption">${esc(t.confirmAlways)}</p></main>`;
    return `<main class="rh-running"><span class="rh-kicker">${esc(t.ready)}</span><h1>${esc(t.pausedTitle)}</h1><p class="rh-sub">${esc(s.stoppedKind === 'focus' ? t.pausedSub : t.interrupted)}</p>${button(t.restartHome,'return-home','rh-primary')}</main>`;
  }
  function journal(s,t) {
    const letters = [{text:s.sampleEdit === undefined ? t.sample : s.sampleEdit,sample:true},...s.letters];
    return `<main class="rh-notebook"><aside class="rh-notebook-side"><span class="rh-kicker">${esc(t.journal)}</span><h2>${esc(t.earlier)}</h2><span class="rh-caption">${esc(t.previewOnly)}</span></aside><div class="rh-notebook-main"><h2>${esc(t.letterTitle)}</h2><p class="rh-sub" style="margin-top:12px">${esc(t.letterIntro)}</p>${letters.map((entry,i)=>`<article class="rh-letter-card"><span class="rh-caption">${esc(entry.sample?t.sampleLabel:t.newLetter)}</span>${s.editing === i ? `<label><span class="rh-label">${esc(t.edit)}</span><textarea data-input="edit" maxlength="4000">${esc(entry.text)}</textarea></label><div class="rh-edit-actions">${button(t.saveEdit,`save-edit-${i}`,'rh-primary')}${button(t.cancel,'cancel-edit','rh-link')}</div>` : `<p>${esc(entry.text)}</p>${button(t.edit,`edit-${i}`,'rh-link')}`}</article>`).join('')}</div></main>`;
  }
  function settings(s,t) {
    const numeric = (key,title,min,max)=>`<label><span class="rh-label">${esc(title)}</span><input type="number" min="${min}" max="${max}" step="1" data-setting="${key}" value="${s[key]}" required></label>`;
    const selector = (key,title,options)=>`<label><span class="rh-label">${esc(title)}</span><select data-setting="${key}">${options.map(([value,label])=>`<option value="${value}" ${s[key]===value?'selected':''}>${esc(label)}</option>`).join('')}</select></label>`;
    return `<main class="rh-body"><div class="rh-settings"><h2>${esc(t.advancedTitle)}</h2><p class="rh-sub">${esc(t.advancedIntro)}</p><h3>${esc(t.durationTitle)}</h3><div class="rh-fields">${numeric('focus',t.focusMinutes,1,180)}${numeric('short',t.shortMinutes,1,180)}${numeric('long',t.longMinutes,1,180)}${numeric('every',t.every,1,12)}</div><h3>${esc(t.experienceTitle)}</h3><div class="rh-fields">${selector('language',t.language,[['system',t.languageSystem],['en','English'],['zh-Hans','简体中文'],['zh-Hant','繁體中文']])}${selector('appearance',t.appearance,[['system',t.appearanceSystem],['light',t.light],['dark',t.dark]])}${selector('restStyle',t.restStyle,[['invitation',t.invitation],['screen',t.screen]])}</div><p class="rh-setting-notice">${esc(t.confirmAlways)}</p>${button(t.apply,'apply-settings','rh-primary')}<p class="rh-alert" role="status">${esc(s.notice)}</p><div class="rh-private-row"><span>${esc(t.cloud)}</span><span>${esc(t.ai)}</span></div><p class="rh-setting-notice">${esc(t.advancedFuture)}</p></div></main>`;
  }
  function render(key) {
    const s=state[key], t=words(s), app=apps[key];
    app.lang=lang(s);
    if(s.appearance==='system')app.style.removeProperty('color-scheme');else app.style.colorScheme=s.appearance;
    const stageLabels={home:t.hello,focus:t.focusTitle,focusComplete:t.focused,readyRest:t.restReady,rest:t.restTitle,restComplete:t.restDone,readyFocus:t.nextReady,stopped:t.pausedTitle};
    app.innerHTML=header(s,t)+(s.view==='journal'?journal(s,t):s.view==='advanced'?settings(s,t):s.stage==='home'?home(key,s,t):moment(s,t))+footer(t)+`<div class="rh-status" role="status" aria-live="polite">${esc(s.view==='now'?stageLabels[s.stage]:t[s.view])}</div>`;
    root.querySelector(`[data-demo-label="${key}"]`).textContent=t.demo;
    const finish = root.querySelector(`[data-demo-end="${key}"]`);
    finish.textContent=t.finish;
    finish.disabled=!['focus','rest'].includes(s.stage);
    root.querySelector(`[data-demo-reset="${key}"]`).textContent=t.restart;
    if (globalThis.lucide) lucide.createIcons({attrs:{width:18,height:18}});
  }
  function complete(key) {
    const s=state[key];
    if(s.stage==='focus'){ s.completed++; s.stage='focusComplete'; }
    else if(s.stage==='rest'){ if(s.activeRestType==='long')s.completed=0; s.activeRestType=null; s.stage='restComplete'; }
    else return;
    s.view='now'; s.draft=''; render(key);
  }
  root.addEventListener('input',event=>{
    const app=event.target.closest('[data-app]');
    if(!app)return;
    const s=state[app.dataset.app];
    if(event.target.dataset.input==='intention')s.intention=event.target.value;
    if(event.target.dataset.input==='draft')s.draft=event.target.value;
  });
  root.addEventListener('change',event=>{
    const app=event.target.closest('[data-app]');
    if(!app)return;
    const key=app.dataset.app,s=state[key],setting=event.target.dataset.setting;
    if(setting==='language' || setting==='appearance'){
      // Preserve numeric edits while translating the current settings view.
      app.querySelectorAll('input[data-setting]').forEach(input=>{const number=Number(input.value);if(Number.isInteger(number)&&number>=1&&number<=(input.dataset.setting==='every'?12:180))s[input.dataset.setting]=number;});
      s[setting]=event.target.value;s.notice='';render(key);remember();
    }
  });
  root.addEventListener('click',event=>{
    const end=event.target.closest('[data-demo-end]');
    if(end){complete(end.dataset.demoEnd);return;}
    const reset=event.target.closest('[data-demo-reset]');
    if(reset){const key=reset.dataset.demoReset;const previous=state[key];state[key]=makeState();state[key].language=previous.language;state[key].appearance=previous.appearance;render(key);return;}
    const target=event.target.closest('[data-action]');
    if(!target)return;
    const app=target.closest('[data-app]'),key=app.dataset.app,s=state[key],t=words(s),action=target.dataset.action;
    if(action.startsWith('view-')){s.view=action.slice(5);s.notice='';s.editing=null;}
    else if(action==='start-focus'){s.stage='focus';s.view='now';s.draft='';}
    else if(action==='start-rest'){s.activeRestType=longRestDue(s)?'long':'short';s.stage='rest';s.view='now';}
    else if(action==='stop'){s.stoppedKind=s.stage;s.stage='stopped';}
    else if(action==='return-home'){s.stage='home';s.view='now';}
    else if(action==='keep-reflection' || action==='skip-reflection'){
      if(action==='keep-reflection' && s.draft.trim())s.letters.push({text:s.draft.trim(),sample:false});
      s.draft='';s.stage=s.stage==='focusComplete'?'readyRest':'readyFocus';
    }
    else if(action.startsWith('idea-'))s.restIdea=action.slice(5);
    else if(action.startsWith('edit-'))s.editing=Number(action.slice(5));
    else if(action==='cancel-edit')s.editing=null;
    else if(action.startsWith('save-edit-')){
      const index=Number(action.slice(10));const text=app.querySelector('[data-input="edit"]').value;
      if(index===0)s.sampleEdit=text;else s.letters[index-1].text=text;s.editing=null;
    }
    else if(action==='apply-settings'){
      const values={};let valid=true;
      app.querySelectorAll('[data-setting]').forEach(input=>{
        const setting=input.dataset.setting;
        if(['focus','short','long','every'].includes(setting)){
          const value=Number(input.value);if(!Number.isInteger(value)||value<1||value>(setting==='every'?12:180))valid=false;values[setting]=value;
        } else values[setting]=input.value;
      });
      if(valid){Object.assign(s,values);s.notice=words(s).applied;}else s.notice=t.validation;
    }
    render(key);remember();
  });
  window.addEventListener('openai:set_globals',event=>{
    if(event.detail && event.detail.globals && event.detail.globals.widgetState){restore(event.detail.globals.widgetState);Object.keys(apps).forEach(render);}
  });
  Object.keys(apps).forEach(render);
  if(globalThis.Tweak){
    for(const key of Object.keys(apps)){
      const controls={moment:'home'};
      const tweak=new Tweak({container:apps[key],onChange:()=>{if(stages.includes(controls.moment)){state[key].stage=controls.moment;state[key].view='now';if(controls.moment==='readyRest' && state[key].completed===0)state[key].completed=1;if(controls.moment==='rest')state[key].activeRestType=longRestDue(state[key])?'long':'short';render(key);}}});
      tweak.addSelect(controls,'moment',{label:'Preview moment',options:[{label:'Arrival',value:'home'},{label:'Quiet focus',value:'focus'},{label:'Focus reflection',value:'focusComplete'},{label:'Confirm rest',value:'readyRest'},{label:'Genuine rest',value:'rest'},{label:'Rest reflection',value:'restComplete'},{label:'Confirm focus',value:'readyFocus'}]});
    }
  }
})();
</script>
